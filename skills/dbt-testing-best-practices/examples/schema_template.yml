version: 2

models:
  - name: stg_ecommerce__orders
    description: "Staging model for raw e-commerce orders with defensive status mapping."
    columns:
      - name: order_id
        description: "Primary key for the order."
        tests:
          - unique:
              severity: error
          - not_null:
              severity: error

      - name: customer_id
        description: "Foreign key referencing stg_ecommerce__customers."
        tests:
          - not_null
          - relationships:
              to: ref('stg_ecommerce__customers')
              field: customer_id
              severity: warn

      - name: order_status
        description: "Categorical status with defensive 'other' fallback."
        tests:
          - not_null
          - accepted_values:
              values: ['placed', 'processing', 'shipped', 'delivered', 'cancelled', 'returned', 'other']
              severity: warn

  - name: fct_orders
    description: "Core fact table with enforced data contract for BI consumers."
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: string
        description: "Primary key for fct_orders."
        tests:
          - unique:
              severity: error
          - not_null:
              severity: error

      - name: subtotal_amount_usd
        data_type: numeric
        description: "Subtotal monetary amount in USD."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "subtotal_amount_usd >= 0"
              severity: error

unit_tests:
  - name: test_fct_orders_calculation
    model: fct_orders
    given:
      - input: ref('stg_ecommerce__orders')
        rows:
          - {order_id: '101', customer_id: 'C1', order_status: 'delivered', subtotal_amount_usd: 100.0}
    expect:
      rows:
        - {order_id: '101', customer_id: 'C1', order_status: 'delivered', subtotal_amount_usd: 100.0}
